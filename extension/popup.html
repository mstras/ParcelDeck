<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<style>body{width:300px;padding:14px;display:grid;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px}</style>
</head>
<body>
  <h1><img src="icons/48.png" width="22" height="22" alt="">ParcelDeck</h1>
  <div class="card" id="status"><span class="muted">Not synced yet</span></div>
  <div class="row">
    <button id="sync">Sync now</button>
    <button class="ghost" id="open">Open ParcelDeck</button>
  </div>
  <div class="muted">Checks your last 30 days of Amazon orders every hour while Chrome is open. <a href="#" id="opts">Settings</a></div>
  <script src="popup.js"></script>
</body>
</html>
